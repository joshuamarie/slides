project:
  type: website
  output-dir: docs

website:
  title: "Slides - Joshua Marie"
  favicon: "assets/jm-favicon.png"
  site-url: https://slides.joshuamarie.com
  repo-url: https://github.com/joshuamarie/slides
  navbar:
    background: dark
    search: true
    left:
      - href: index.qmd
        text: "All Slides"
    right:
      - icon: github
        href: https://github.com/joshuamarie
        aria-label: GitHub
      - text: Resources
        menu:
        - href: resources/materials.qmd
          text: Materials
        - href: resources/assignments.qmd
          text: Assignments
  page-footer:
    center: "© 2025 Joshua Marie. Made with [Quarto](https://quarto.org/)"
    background: light
  # google-analytics: "G-XXXXXXXXXX"  

format:
  html:
    theme: 
      light: [cosmo, global.scss]
      dark: [darkly, global.scss]
    css: styles.css
    toc: false
    code-copy: true
    code-overflow: wrap
    fontsize: 1.1em
    mainfont: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    
    